[package]
name = "xiaoyao-bill-desktop"
version = "1.0.0"
description = "小遥账单桌面版"
authors = ["dtsola"]
license = "MIT"
edition = "2021"
rust-version = "1.95"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
bill-core = { path = "../crates/bill-core" }
bill-parsers = { path = "../crates/bill-parsers" }
bill-services = { path = "../crates/bill-services" }
bill-api = { path = "../crates/bill-api" }
bill-mcp = { path = "../crates/bill-mcp" }
